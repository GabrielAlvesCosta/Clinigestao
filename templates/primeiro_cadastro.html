<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <img src="static/img/logo.png" alt="Logo da Clínica" class="logo-flutuante">

    <div class="container">

        <h1>Primeiro Cadastro de Administrador</h1>

        {% if error %}
        <div class="message error-message active" role="alert">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="message success-message active" role="status">{{ success }}</div>
        {% endif %}

        <form id="cadastroForm" method="post" action="{{ url_for('primeiro_cadastro', chave=CHAVE_CADASTRO_ATUAL) }}" enctype="multipart/form-data">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" value="{{ nome or '' }}" placeholder="Digite o nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder="Digite o e-mail" required>

            <label for="senha">Senha</label>
            <div class="password-wrapper">
                <input type="password" id="senha" name="senha" placeholder="Digite a senha" minlength="6" autocomplete="new-password" required>
                <button type="button" class="toggle-password" data-target="senha" aria-label="Mostrar senha"><i class="fa-solid fa-eye"></i></button>
            </div>
            <div class="password-hint" style="font-size: 12px; color: #5a5a5a; margin-top: 6px; margin-bottom: 6px;">
                A senha precisa ter: 1 letra maiúscula, 1 letra minúscula e 1 caractere especial.
            </div>
            <div id="senhaErro" class="error-message password-rule" style="display: none; margin-top: 6px; padding: 8px 10px; border-radius: 6px; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-weight: 600;">A senha deve ter no mínimo 6 caracteres.</div>

            <label for="confirmar_senha">Confirmar Senha</label>
            <div class="password-wrapper">
                <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirme a senha" autocomplete="new-password" required>
                <button type="button" class="toggle-password" data-target="confirmar_senha" aria-label="Mostrar senha"><i class="fa-solid fa-eye"></i></button>
            </div>
            <div id="confirmarErro" class="error-message password-rule" style="display: none; margin-top: 6px; padding: 8px 10px; border-radius: 6px; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-weight: 600;">As senhas não conferem.</div>

            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" name="cargo" value="{{ cargo or '' }}" placeholder="Digite o cargo" maxlength="30" title="Máximo 30 caracteres" required>

            <label for="crm_coren">CRM/COREM</label>
            <input type="text" id="crm_coren" name="crm_coren" value="{{ crm_coren or '' }}" placeholder="Digite o CRM ou COREM">

            <label for="assinatura">Assinatura Digital (Imagem)</label>
            <input type="file" id="assinatura" name="assinatura" accept="image/*" required style="padding: 8px 0;">

            <label for="perfil">Perfil</label>
            <select id="perfil" name="admin">
                <option value="admin" {% if admin == 'admin' %}selected{% endif %}>Admin</option>
            </select>

            
            

            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/cadastro.js') }}"></script> 
</body>
</html>
